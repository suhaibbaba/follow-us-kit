<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Business Card</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .card-container {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 30px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 450px;
        width: 100%;
        overflow: hidden;
        animation: slideUp 0.6s ease-out;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 40px 30px;
        text-align: center;
        color: white;
        position: relative;
        overflow: hidden;
      }

      .header::before {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.1) 0%,
          transparent 70%
        );
        animation: pulse 4s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
      }

      .profile-img {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 5px solid white;
        margin: 0 auto 20px;
        background: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
        position: relative;
        z-index: 1;
      }

      .name {
        font-size: 28px;
        font-weight: bold;
        margin-bottom: 8px;
        position: relative;
        z-index: 1;
      }

      .title {
        font-size: 16px;
        opacity: 0.9;
        position: relative;
        z-index: 1;
      }

      .content {
        padding: 30px;
      }

      .links-section {
        margin-bottom: 30px;
      }

      .link-item {
        display: flex;
        align-items: center;
        padding: 15px 20px;
        margin-bottom: 12px;
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        border-radius: 15px;
        text-decoration: none;
        color: #333;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }

      .link-item:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      }

      .link-icon {
        width: 24px;
        height: 24px;
        margin-right: 15px;
        font-size: 24px;
      }

      .link-text {
        font-size: 16px;
        font-weight: 500;
      }

      .map-section {
        margin-top: 30px;
      }

      .section-title {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 15px;
        color: #333;
        display: flex;
        align-items: center;
      }

      .map-container {
        width: 100%;
        height: 250px;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }

      .map-container iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      @media (max-width: 480px) {
        .card-container {
          border-radius: 20px;
        }

        .header {
          padding: 30px 20px;
        }

        .content {
          padding: 20px;
        }

        .name {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="card-container">
      <div class="header">
        <div class="profile-img">👤</div>
        <div class="name">Your Name</div>
        <div class="title">Your Title / Position</div>
      </div>

      <div class="content">
        <div class="links-section">
          <a href="tel:+1234567890" class="link-item">
            <div class="link-icon">📞</div>
            <div class="link-text">Call Me</div>
          </a>

          <a href="mailto:your.email@example.com" class="link-item">
            <div class="link-icon">📧</div>
            <div class="link-text">Email Me</div>
          </a>

          <a href="https://wa.me/972592701910" target="_blank" class="link-item">
            <div class="link-icon">💬</div>
            <div class="link-text">WhatsApp</div>
          </a>

          <a
            href="https://linkedin.com/in/yourprofile"
            target="_blank"
            class="link-item"
          >
            <div class="link-icon">💼</div>
            <div class="link-text">LinkedIn</div>
          </a>

          <a href="https://yourwebsite.com" target="_blank" class="link-item">
            <div class="link-icon">🌐</div>
            <div class="link-text">Website</div>
          </a>

          <a
            href="https://instagram.com/yourprofile"
            target="_blank"
            class="link-item"
          >
            <div class="link-icon">📸</div>
            <div class="link-text">Instagram</div>
          </a>
        </div>

        <div class="map-section">
          <div class="section-title">📍 Find Us Here</div>
          <div class="map-container">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.019284820823!2d-122.41941708468208!3d37.77492977975903!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8085809c6c8f4459%3A0xb10ed6d9b5050fa5!2sTwitter%20HQ!5e0!3m2!1sen!2sus!4v1234567890123!5m2!1sen!2sus"
              allowfullscreen=""
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
            >
            </iframe>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
