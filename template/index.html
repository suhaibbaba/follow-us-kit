<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Follow Us</title>

    <!--
      Follow Us — shared template.
      Do NOT edit this file per client: edit ./config.js instead.
      Any design change belongs here and is then re-synced into every client
      folder (see README.md).
    -->
    <style>
      :root {
        /* Overwritten at runtime from SITE_CONFIG.theme */
        --primary: #235c63;
        --primary-dark: #174146;
        --primary-darker: #0d2b2e;
        --primary-tint: #eef4f5;
        --primary-tint-strong: #dfebec;
        --on-primary: #ffffff;
        --radius: 18px;

        --ink: #1f2933;
        --ink-soft: #52606d;
        --card-bg: #ffffff;
        --shadow-sm: 0 4px 14px rgba(15, 23, 26, 0.08);
        --shadow-md: 0 10px 28px rgba(15, 23, 26, 0.14);
        --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.28);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, system-ui, -apple-system, sans-serif;
        background: linear-gradient(160deg, var(--primary) 0%, var(--primary-darker) 100%);
        background-attachment: fixed;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px 16px;
        color: var(--ink);
      }

      /* ---------- Card ---------- */

      .card {
        width: 100%;
        max-width: 450px;
        background: var(--card-bg);
        border-radius: calc(var(--radius) + 12px);
        box-shadow: var(--shadow-lg);
        overflow: hidden;
        animation: rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .card__header {
        background: linear-gradient(150deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: var(--on-primary);
        padding: 38px 28px 32px;
        text-align: center;
        position: relative;
        overflow: hidden;
      }

      .card__header::before {
        content: "";
        position: absolute;
        inset: -50%;
        background: radial-gradient(circle at 50% 40%, rgba(255, 255, 255, 0.18) 0%, transparent 62%);
        pointer-events: none;
      }

      .logo-ring {
        position: relative;
        z-index: 1;
        width: 120px;
        height: 120px;
        margin: 0 auto 18px;
        border-radius: 50%;
        background: #fff;
        border: 4px solid rgba(255, 255, 255, 0.85);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        animation: pop 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.08s both;
      }

      .logo-ring img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        padding: 8px;
      }

      .name {
        position: relative;
        z-index: 1;
        font-size: 27px;
        line-height: 1.25;
        font-weight: 700;
        letter-spacing: 0.2px;
      }

      .tagline {
        position: relative;
        z-index: 1;
        margin-top: 8px;
        font-size: 15px;
        line-height: 1.5;
        opacity: 0.92;
      }

      .card__body {
        padding: 28px 24px 30px;
      }

      /* ---------- Links ---------- */

      .links {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .link {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 18px;
        border-radius: var(--radius);
        background: var(--primary-tint);
        color: var(--ink);
        text-decoration: none;
        box-shadow: var(--shadow-sm);
        transition: transform 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
        animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
        animation-delay: calc(0.12s + var(--i, 0) * 0.06s);
      }

      .link:hover,
      .link:focus-visible {
        transform: translateY(-3px);
        background: var(--primary-tint-strong);
        box-shadow: var(--shadow-md);
      }

      .link:focus-visible {
        outline: 3px solid var(--primary);
        outline-offset: 2px;
      }

      .link:active {
        transform: translateY(-1px);
      }

      .link__icon {
        flex: 0 0 auto;
        width: 26px;
        height: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--primary);
      }

      .link__icon svg {
        width: 100%;
        height: 100%;
        display: block;
        fill: currentColor;
      }

      .link__icon img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      .link__label {
        font-size: 16px;
        font-weight: 600;
      }

      /* ---------- Map ---------- */

      .map {
        margin-top: 28px;
        animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both;
      }

      .section-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 14px;
        color: var(--ink);
      }

      .section-title svg {
        width: 20px;
        height: 20px;
        fill: var(--primary);
      }

      .map__frame {
        width: 100%;
        height: 250px;
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: var(--shadow-sm);
        background: var(--primary-tint);
      }

      .map__frame iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }

      /* ---------- Misc ---------- */

      .config-error {
        max-width: 450px;
        background: #fff;
        border-radius: 16px;
        padding: 24px;
        font-size: 15px;
        line-height: 1.6;
        box-shadow: var(--shadow-lg);
      }

      .config-error code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #f1f3f5;
        padding: 1px 5px;
        border-radius: 5px;
      }

      [hidden] {
        display: none !important;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(22px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.86);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 16px 12px;
        }

        .card__header {
          padding: 30px 20px 26px;
        }

        .logo-ring {
          width: 104px;
          height: 104px;
        }

        .name {
          font-size: 23px;
        }

        .card__body {
          padding: 22px 18px 24px;
        }

        .map__frame {
          height: 220px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }

        .link:hover,
        .link:focus-visible {
          transform: none;
        }
      }
    </style>
  </head>

  <body>
    <main class="card" id="card" hidden>
      <header class="card__header">
        <div class="logo-ring" id="logo-ring">
          <img id="logo" alt="" />
        </div>
        <h1 class="name" id="name"></h1>
        <p class="tagline" id="tagline" hidden></p>
      </header>

      <div class="card__body">
        <nav class="links" id="links" aria-label="Contact and social links"></nav>

        <section class="map" id="map" hidden>
          <h2 class="section-title">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z" />
            </svg>
            <span id="map-title"></span>
          </h2>
          <div class="map__frame">
            <iframe
              id="map-frame"
              title="Location map"
              loading="lazy"
              allowfullscreen
              referrerpolicy="no-referrer-when-downgrade"
            ></iframe>
          </div>
        </section>
      </div>
    </main>

    <script src="./config.js"></script>

        var SVG_OPEN = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">';

        /* ---------------------------- helpers ---------------------------- */

        function parseHex(hex) {
          var value = String(hex || "").trim().replace("#", "");
          if (value.length === 3) {
            value = value[0] + value[0] + value[1] + value[1] + value[2] + value[2];
          }
          if (!/^[0-9a-fA-F]{6}$/.test(value)) return null;
          return {
            r: parseInt(value.slice(0, 2), 16),
            g: parseInt(value.slice(2, 4), 16),
            b: parseInt(value.slice(4, 6), 16)
          };
        }

        function rgb(c) {
          return "rgb(" + Math.round(c.r) + ", " + Math.round(c.g) + ", " + Math.round(c.b) + ")";
        }

        /* amount: 0 = unchanged, 1 = black */
        function darken(c, amount) {
          return { r: c.r * (1 - amount), g: c.g * (1 - amount), b: c.b * (1 - amount) };
        }

        /* amount: 0 = unchanged, 1 = white */
        function lighten(c, amount) {
          return {
            r: c.r + (255 - c.r) * amount,
            g: c.g + (255 - c.g) * amount,
            b: c.b + (255 - c.b) * amount
          };
        }

        /* Perceived brightness, used to keep header text readable. */
        function luminance(c) {
          return (c.r * 299 + c.g * 587 + c.b * 114) / 1000;
        }

        function isSameTabLink(href) {
          return /^(tel:|mailto:|sms:)/i.test(String(href || "").trim());
        }

        function normalizeRadius(radius) {
          if (typeof radius === "number" && isFinite(radius)) return radius + "px";
          var text = String(radius == null ? "" : radius).trim();
          if (!text) return null;
          return /^[0-9.]+$/.test(text) ? text + "px" : text;
        }

        function showError(message) {
          var box = document.createElement("div");
          box.className = "config-error";
          box.innerHTML =
            "<strong>Follow&nbsp;Us — configuration problem</strong><br />" + message;
          document.body.appendChild(box);
        }

        /* ---------------------------- rendering --------------------------- */

        function applyTheme(theme) {
          var root = document.documentElement.style;
          var color = parseHex(theme.primary) || parseHex("#235c63");

          root.setProperty("--primary", rgb(color));
          root.setProperty("--primary-dark", rgb(darken(color, 0.22)));
          root.setProperty("--primary-darker", rgb(darken(color, 0.45)));
          root.setProperty("--primary-tint", rgb(lighten(color, 0.9)));
          root.setProperty("--primary-tint-strong", rgb(lighten(color, 0.82)));
          root.setProperty("--on-primary", luminance(color) > 170 ? "#12232b" : "#ffffff");

          var radius = normalizeRadius(theme.radius);
          if (radius) root.setProperty("--radius", radius);
        }

        function buildIcon(link) {
          var wrap = document.createElement("span");
          wrap.className = "link__icon";

          if (link.iconUrl) {
            var img = document.createElement("img");
            img.src = link.iconUrl;
            img.alt = "";
            wrap.appendChild(img);
            return wrap;
          }

          var key = String(link.icon || "").trim().toLowerCase();
          var path = ICONS[key] || ICONS.website;
          wrap.innerHTML = SVG_OPEN + path + "</svg>";
          return wrap;
        }

        function buildLink(link, index) {
          var a = document.createElement("a");
          a.className = "link";
          a.href = link.href || "#";
          a.style.setProperty("--i", index);

          if (!isSameTabLink(link.href)) {
            a.target = "_blank";
            a.rel = "noopener noreferrer";
          }

          var label = document.createElement("span");
          label.className = "link__label";
          label.textContent = link.label || link.href || "";

          a.appendChild(buildIcon(link));
          a.appendChild(label);
          return a;
        }

        function render(config) {
          applyTheme(config.theme || {});

          var name = config.name || "Follow Us";
          document.title = name;
          document.getElementById("name").textContent = name;

          var logo = document.getElementById("logo");
          if (config.logo) {
            logo.src = config.logo;
            logo.alt = name + " logo";
          } else {
            document.getElementById("logo-ring").hidden = true;
          }

          var tagline = document.getElementById("tagline");
          if (config.tagline && String(config.tagline).trim()) {
            tagline.textContent = config.tagline;
            tagline.hidden = false;
          }

          var list = document.getElementById("links");
          var links = Array.isArray(config.links) ? config.links : [];
          links.forEach(function (link, i) {
            if (link && link.href) list.appendChild(buildLink(link, i));
          });

          var map = config.map;
          if (map && map.embedUrl) {
            document.getElementById("map-title").textContent = map.title || "Find Us Here";
            document.getElementById("map-frame").src = map.embedUrl;
            document.getElementById("map").hidden = false;
          }

          document.getElementById("card").hidden = false;
        }

        var config = window.SITE_CONFIG;
        if (!config || typeof config !== "object") {
          showError(
            "<code>window.SITE_CONFIG</code> was not found. Make sure <code>config.js</code> " +
              "sits next to this file and assigns the config object."
          );
        } else {
          render(config);
        }
      })();
    </script>
  </body>
</html>
